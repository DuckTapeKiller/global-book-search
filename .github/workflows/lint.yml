name: Lint and test

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Obsidian's official plugin lint on every file, plus formatting and the
      # type check; any error or warning fails the run.
      - name: Lint (official Obsidian rules)
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test
